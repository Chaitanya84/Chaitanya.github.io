<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proprietary Notice</title>
    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            overflow: hidden;
            background-color: #f4f4f4;
        }

        /* The Big Exclamation Mark */
        body::before {
            content: "!";
            position: absolute;
            font-size: 80vh; /* Massive size */
            font-weight: 900;
            color: rgba(0, 0, 0, 0.05); /* Semi-transparent */
            z-index: -1;
            pointer-events: none;
        }

        b {
            font-size: 2.5rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #333;
            padding: 20px;
        }
    </style>
</head>
<body>
    <b>proprietary software owned by employer/Customer</b>
</body>
</html>
