<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaitanya Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        input[type=text] {
            width: 50%;
            padding: 10px;
            font-size: 16px;
        }
        input[type=submit] {
            padding: 10px 20px;
            font-size: 16px;
        }
        img {
            width: 272px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <img src="https://via.placeholder.com/272x92.png?text=Chaitanya" alt="Chaitanya Logo">
    <form action="https://www.google.com/search" method="get">
        <input type="text" name="q" placeholder="Search Chaitanya...">
        <input type="submit" value="Chaitanya Search">
    </form>
</body>
</html>
